name: Windows Release Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Verify Java packaging tools
        shell: pwsh
        run: |
          java --version
          jpackage --version

      - name: Install WiX 5.0.2
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.0.2
          "$env:USERPROFILE\.dotnet\tools" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install WiX extensions
        shell: pwsh
        run: |
          wix extension add --global WixToolset.Util.wixext/5.0.2
          wix extension add --global WixToolset.UI.wixext/5.0.2
          wix --version
          wix extension list --global

      - name: Run tests
        shell: pwsh
        run: .\gradlew.bat test

      - name: Build portable Windows package
        shell: pwsh
        run: .\gradlew.bat packageWindowsPortable

      - name: Build Windows installer
        shell: pwsh
        run: .\gradlew.bat packageWindowsInstaller

      - name: Validate release artifacts
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File .\tools\validate-windows-release.ps1 -Mode Artifacts

      - name: Upload Windows release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: VS-Cartographer-1.0.0-Windows
          retention-days: 14
          if-no-files-found: error
          path: |
            build/distributions/VS-Cartographer-1.0.0-win-x64.zip
            build/distributions/VS-Cartographer-Setup-1.0.0.exe
            build/release-validation/SHA256SUMS.txt
