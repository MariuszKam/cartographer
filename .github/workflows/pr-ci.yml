name: PR CI

on:
  pull_request:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: pr-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Run tests
        shell: pwsh
        run: .\gradlew.bat test

      - name: Validate PowerShell tooling syntax
        shell: pwsh
        run: |
          $scripts = @(
            "tools/validate-windows-release.ps1",
            "tools/validate-auto-update-stage5.ps1"
          )

          foreach ($script in $scripts) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $script),
              [ref]$tokens,
              [ref]$errors
            )

            if ($errors.Count -gt 0) {
              $errors | ForEach-Object {
                Write-Error "$script : $($_.Message)"
              }
              throw "PowerShell syntax validation failed: $script"
            }
          }
