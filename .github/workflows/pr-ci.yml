name: PR CI

on:
  pull_request:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: pr-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Audit test architecture
        shell: pwsh
        run: .\gradlew.bat testArchitectureAudit

      - name: Enforce test architecture guard
        shell: pwsh
        run: .\gradlew.bat testArchitectureGuard

      - name: Run tests
        shell: pwsh
        run: .\gradlew.bat test

      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-evidence
          if-no-files-found: warn
          path: |
            build/test-results/test/**
            build/reports/tests/test/**
            build/reports/test-performance/**

      - name: Validate PowerShell tooling syntax
        shell: pwsh
        run: |
          $scripts = @(
            "tools/validate-windows-release.ps1",
            "tools/validate-auto-update-stage5.ps1"
          )

          foreach ($script in $scripts) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $script),
              [ref]$tokens,
              [ref]$errors
            )

            if ($errors.Count -gt 0) {
              $errors | ForEach-Object {
                Write-Error "$script : $($_.Message)"
              }
              throw "PowerShell syntax validation failed: $script"
            }
          }

  test-topology:
    if: github.head_ref == 'test-perf-parallel-test-architecture'
    needs: test
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        workers: [1, 2, 3, 4]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Run parallel topology probe
        shell: pwsh
        run: .\gradlew.bat testParallelProbe -PtestParallelForks=${{ matrix.workers }}

      - name: Upload topology evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-topology-workers-${{ matrix.workers }}
          if-no-files-found: warn
          path: |
            build/test-results/testParallelProbe/**
            build/reports/tests/testParallelProbe/**
            build/reports/test-performance/test-parallel-probe-*

  test-topology-summary:
    if: always() && github.head_ref == 'test-perf-parallel-test-architecture'
    needs: test-topology
    runs-on: windows-latest

    steps:
      - name: Download topology evidence
        uses: actions/download-artifact@v5
        with:
          pattern: test-topology-workers-*
          path: topology-evidence

      - name: Build topology summary
        shell: pwsh
        run: |
          $rows = @()

          Get-ChildItem topology-evidence -Directory |
            Sort-Object Name |
            ForEach-Object {
              if ($_.Name -notmatch 'test-topology-workers-(\d+)$') {
                return
              }

              $workers = [int]$Matches[1]
              $summary = Get-ChildItem $_.FullName -Recurse -Filter 'test-parallel-probe-suite-summary.csv' | Select-Object -First 1

              if ($null -eq $summary) {
                throw "Missing suite summary for worker count $workers"
              }

              $metrics = @{}
              Import-Csv $summary.FullName | ForEach-Object {
                $metrics[$_.metric] = $_.value
              }

              $rows += [pscustomobject]@{
                workers = $workers
                durationMs = [long]$metrics['durationMs']
                testCount = [long]$metrics['testCount']
                successfulTestCount = [long]$metrics['successfulTestCount']
                failedTestCount = [long]$metrics['failedTestCount']
                skippedTestCount = [long]$metrics['skippedTestCount']
              }
            }

          if ($rows.Count -ne 4) {
            throw "Expected four topology summaries, found $($rows.Count)"
          }

          $expectedTestCount = $rows[0].testCount
          foreach ($row in $rows) {
            if ($row.testCount -ne $expectedTestCount) {
              throw "Topology probes executed different test counts"
            }
            if ($row.failedTestCount -ne 0) {
              throw "Topology probe with $($row.workers) workers reported failures"
            }
          }

          $outputDir = 'topology-summary'
          New-Item -ItemType Directory -Force $outputDir | Out-Null
          $summaryPath = Join-Path $outputDir 'test-topology-summary.csv'
          $rows | Sort-Object workers | Export-Csv -Path $summaryPath -NoTypeInformation

          Add-Content $env:GITHUB_STEP_SUMMARY '## Test topology matrix'
          Add-Content $env:GITHUB_STEP_SUMMARY ''
          Add-Content $env:GITHUB_STEP_SUMMARY '| Workers | Duration (ms) | Tests | Passed | Failed | Skipped |'
          Add-Content $env:GITHUB_STEP_SUMMARY '| ---: | ---: | ---: | ---: | ---: | ---: |'
          foreach ($row in ($rows | Sort-Object workers)) {
            Add-Content $env:GITHUB_STEP_SUMMARY (
              "| $($row.workers) | $($row.durationMs) | $($row.testCount) | " +
              "$($row.successfulTestCount) | $($row.failedTestCount) | " +
              "$($row.skippedTestCount) |"
            )
          }

      - name: Upload topology summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-topology-summary
          if-no-files-found: warn
          path: topology-summary/**

  test-stress:
    if: github.head_ref == 'test-perf-parallel-test-architecture'
    needs: test-topology-summary
    runs-on: windows-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        workers: [1, 2, 3]
        repetition: [1, 2, 3]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Run stress probe
        shell: pwsh
        run: .\gradlew.bat testParallelProbe -PtestParallelForks=${{ matrix.workers }}

      - name: Upload stress evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-stress-workers-${{ matrix.workers }}-run-${{ matrix.repetition }}
          if-no-files-found: warn
          path: |
            build/test-results/testParallelProbe/**
            build/reports/tests/testParallelProbe/**
            build/reports/test-performance/test-parallel-probe-*

  test-stress-summary:
    if: always() && github.head_ref == 'test-perf-parallel-test-architecture'
    needs: test-stress
    runs-on: windows-latest

    steps:
      - name: Download stress evidence
        uses: actions/download-artifact@v5
        with:
          pattern: test-stress-workers-*
          path: stress-evidence

      - name: Build stress summary
        shell: pwsh
        run: |
          $samples = @()

          Get-ChildItem stress-evidence -Directory |
            Sort-Object Name |
            ForEach-Object {
              if ($_.Name -notmatch 'test-stress-workers-(\d+)-run-(\d+)$') {
                return
              }

              $workers = [int]$Matches[1]
              $repetition = [int]$Matches[2]
              $summary = Get-ChildItem $_.FullName -Recurse -Filter 'test-parallel-probe-suite-summary.csv' | Select-Object -First 1

              if ($null -eq $summary) {
                throw "Missing stress summary for workers=$workers run=$repetition"
              }

              $metrics = @{}
              Import-Csv $summary.FullName | ForEach-Object {
                $metrics[$_.metric] = $_.value
              }

              $samples += [pscustomobject]@{
                workers = $workers
                repetition = $repetition
                durationMs = [long]$metrics['durationMs']
                testCount = [long]$metrics['testCount']
                successfulTestCount = [long]$metrics['successfulTestCount']
                failedTestCount = [long]$metrics['failedTestCount']
                skippedTestCount = [long]$metrics['skippedTestCount']
              }
            }

          if ($samples.Count -ne 9) {
            throw "Expected nine stress summaries, found $($samples.Count)"
          }

          $expectedTestCount = $samples[0].testCount
          foreach ($sample in $samples) {
            if ($sample.testCount -ne $expectedTestCount) {
              throw "Stress probes executed different test counts"
            }
            if ($sample.failedTestCount -ne 0) {
              throw "Stress probe workers=$($sample.workers) run=$($sample.repetition) reported failures"
            }
          }

          $aggregates = @()
          foreach ($workers in 1, 2, 3) {
            $group = @($samples | Where-Object workers -eq $workers | Sort-Object durationMs)
            if ($group.Count -ne 3) {
              throw "Expected three samples for workers=$workers, found $($group.Count)"
            }

            $aggregates += [pscustomobject]@{
              workers = $workers
              sampleCount = $group.Count
              minDurationMs = $group[0].durationMs
              medianDurationMs = $group[1].durationMs
              maxDurationMs = $group[2].durationMs
              testCount = $expectedTestCount
            }
          }

          $outputDir = 'stress-summary'
          New-Item -ItemType Directory -Force $outputDir | Out-Null
          $samples |
            Sort-Object workers, repetition |
            Export-Csv -Path (Join-Path $outputDir 'test-stress-samples.csv') -NoTypeInformation
          $aggregates |
            Sort-Object workers |
            Export-Csv -Path (Join-Path $outputDir 'test-stress-summary.csv') -NoTypeInformation

          Add-Content $env:GITHUB_STEP_SUMMARY '## Test stress matrix'
          Add-Content $env:GITHUB_STEP_SUMMARY ''
          Add-Content $env:GITHUB_STEP_SUMMARY '| Workers | Samples | Min (ms) | Median (ms) | Max (ms) | Tests |'
          Add-Content $env:GITHUB_STEP_SUMMARY '| ---: | ---: | ---: | ---: | ---: | ---: |'
          foreach ($row in ($aggregates | Sort-Object workers)) {
            Add-Content $env:GITHUB_STEP_SUMMARY (
              "| $($row.workers) | $($row.sampleCount) | $($row.minDurationMs) | " +
              "$($row.medianDurationMs) | $($row.maxDurationMs) | $($row.testCount) |"
            )
          }

      - name: Upload stress summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-stress-summary
          if-no-files-found: warn
          path: stress-summary/**

